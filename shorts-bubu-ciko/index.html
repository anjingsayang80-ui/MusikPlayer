<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubu & Ciko — Episode 1: Mencuri Kue</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151326;color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
main{width:min(100%,440px)}h1{font-size:21px;margin:0 0 5px}p{margin:0 0 12px;color:#c9c5dc;font-size:13px}
.stage{background:#29233d;border:1px solid #51466d;border-radius:20px;padding:9px;box-shadow:0 16px 45px #0007}
canvas{display:block;width:100%;aspect-ratio:9/16;background:#f9d99a;border-radius:13px}
.controls{display:flex;gap:8px;margin-top:10px}.controls button{flex:1;border:0;border-radius:12px;padding:12px 8px;font-weight:700;background:#ffd45e;color:#30233c;font-size:14px}.controls button:nth-child(2){background:#5dd6c4}.bar{height:6px;background:#51466d;border-radius:8px;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#ffd45e}
.note{font-size:12px;color:#aaa4be;margin:10px 3px 0;line-height:1.5}
</style>
</head>
<body><main>
<h1>🐣 Bubu & Ciko — Episode 1</h1><p>Mencuri Kue · Animasi 2D · Pratinjau bergerak</p>
<div class="stage"><canvas id="c" width="540" height="960" aria-label="Animasi Bubu dan Ciko"></canvas>
<div class="bar"><span id="progress"></span></div>
<div class="controls"><button id="play">▶ Putar</button><button id="restart">↻ Ulangi</button></div></div>
<div class="note">Prototipe animasi ini berjalan di browser. Putar untuk melihat adegan, dialog, dan gerakan karakter.</div>
</main>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=540,H=960;
const playBtn=document.getElementById('play'),restartBtn=document.getElementById('restart'),progress=document.getElementById('progress');
let t=0,playing=false,last=0,raf=0;
const duration=36;
function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function line(x1,y1,x2,y2,color,width=8){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(s,x,y,size=30,color='#30233c',align='center',weight='700'){ctx.fillStyle=color;ctx.font=weight+' '+size+'px system-ui';ctx.textAlign=align;ctx.fillText(s,x,y)}
function bubble(s,x,y,w=390){rr(x-w/2,y-48,w,92,22,'#fffdf6');ctx.strokeStyle='#443653';ctx.lineWidth=4;ctx.stroke();text(s,x,y+8,25,'#30233c')}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe8b9');g.addColorStop(1,'#f3ad79');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
rr(25,55,490,600,24,'#fff0cf');rr(55,90,430,430,16,'#f8d8a5');rr(75,110,390,250,10,'#a9d9d1');
line(270,110,270,360,'#fff0cf',9);line(75,235,465,235,'#fff0cf',9);
rr(40,680,460,210,22,'#b66b52');rr(40,680,460,22,10,'#e99a68');rr(55,720,430,150,12,'#98533f');
rr(75,610,390,70,18,'#f8c47a');}
function cake(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
rr(-90,-10,180,90,18,'#fff5e7');rr(-90,-10,180,25,12,'#ff8eb1');rr(-78,-45,156,45,14,'#fff5e7');rr(-78,-45,156,15,8,'#ff8eb1');
for(let i=-48;i<=48;i+=48){ellipse(i,-51,8,12,'#f34f78');}ellipse(0,-75,11,16,'#e84c73');line(0,-90,0,-107,'#4b9d5a',5);
ctx.restore();}
function bubu(x,y,scale=1,mood='happy',bob=0){ctx.save();ctx.translate(x,y+bob);ctx.scale(scale,scale);
line(-35,95,-48,150,'#51375e',18);line(35,95,48,150,'#51375e',18);rr(-76,145,58,24,12,'#342a43');rr(20,145,58,24,12,'#342a43');
rr(-76,5,152,115,32,'#ffd33f');rr(-105,24,34,86,17,'#ffd33f');rr(71,24,34,86,17,'#ffd33f');
ellipse(0,-45,80,87,'#f6c49b'); // ears
ellipse(-78,-54,18,25,'#f6c49b');ellipse(78,-54,18,25,'#f6c49b');
// purple hair
ellipse(-42,-111,43,34,'#7547b5');ellipse(0,-129,48,37,'#7547b5');ellipse(43,-111,42,34,'#7547b5');ellipse(-5,-91,27,32,'#7547b5');
ellipse(-28,-47,9,13,'#30233c');ellipse(28,-47,9,13,'#30233c');ellipse(-31,-51,3,4,'#fff');ellipse(25,-51,3,4,'#fff');
if(mood==='shock'){ellipse(0,-5,15,20,'#7b304b')}else{ctx.strokeStyle='#9a4350';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-14,20,0.2,Math.PI-0.2);ctx.stroke();}
ellipse(-52,-18,13,8,'#f18e8d');ellipse(52,-18,13,8,'#f18e8d');
ctx.restore();}
function ciko(x,y,scale=1,mood='happy',bob=0){ctx.save();ctx.translate(x,y+bob);ctx.scale(scale,scale);
// ears
ctx.save();ctx.rotate(-.2);ellipse(-48,-102,19,64,'#28b8a9');ctx.restore();ctx.save();ctx.rotate(.2);ellipse(48,-102,19,64,'#28b8a9');ctx.restore();
ellipse(0,-20,76,94,'#39cbbb');ellipse(-27,-35,10,13,'#173b46');ellipse(27,-35,10,13,'#173b46');
ellipse(-30,-40,3,4,'#fff');ellipse(24,-40,3,4,'#fff');
if(mood==='shock'){ellipse(0,0,13,18,'#173b46')}else{ctx.strokeStyle='#174c54';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-3,20,.2,Math.PI-.2);ctx.stroke();}
ellipse(-48,-5,12,7,'#83e6cf');ellipse(48,-5,12,7,'#83e6cf');
line(-32,52,-38,92,'#168c83',14);line(32,52,38,92,'#168c83',14);
rr(-61,87,48,20,9,'#f28c38');rr(14,87,48,20,9,'#f28c38');
ctx.restore();}
function scene(){bg();let s='';
if(t<7){s='Rencana rahasia dimulai!';cake(270,620,.9);bubu(155,720,.95,'happy',Math.sin(t*5)*4);ciko(390,725,.9,'happy',Math.sin(t*5+1)*5);if(t>2)bubble('Ciko: “Kuenya kelihatan enak!”',270,180);}
else if(t<14){s='Misi mengambil kue';cake(270,620,.9);bubu(155,720,.95,'shock',Math.sin(t*8)*5);ciko(390,725,.9,'happy',Math.sin(t*8+1)*5);bubble('Bubu: “Pelan-pelan, jangan berisik!”',270,180);}
else if(t<21){s='Ups… ketahuan!';cake(270,620,.9);bubu(155,720,.95,'shock');ciko(390,725,.9,'shock');if(t>16)bubble('Suara Ibu: “SIAPA DI SITU?”',270,180);}
else if(t<29){s='Ciko punya ide';cake(270,620,.9);bubu(155,720,.95,'shock',Math.sin(t*10)*7);ciko(390,725,.9,'happy',Math.sin(t*10)*8);bubble('Ciko: “Kita pura-pura jadi patung!”',270,180);}
else{s='Plot twist: kuenya palsu!';cake(270,620,.9);bubu(155,720,.95,'shock');ciko(390,725,.9,'shock');bubble('Bubu: “Lho… ini kue sabun?!”',270,180);}
rr(40,35,460,60,18,'#ffffffcc');text('BUBU & CIKO',270,75,28,'#53376d');
rr(35,875,470,55,16,'#30233cdd');text(s,270,911,23,'#fff7dc');
}
function draw(){scene();progress.style.width=(t/duration*100)+'%';}
function loop(now){if(!playing)return;if(!last)last=now;let dt=Math.min((now-last)/1000,.05);last=now;t+=dt;if(t>=duration){t=duration;playing=false;playBtn.textContent='▶ Putar lagi';}draw();if(playing)raf=requestAnimationFrame(loop);}
playBtn.onclick=()=>{if(t>=duration)t=0;playing=!playing;playBtn.textContent=playing?'Ⅱ Jeda':'▶ Putar';last=0;if(playing)raf=requestAnimationFrame(loop);else cancelAnimationFrame(raf);};
restartBtn.onclick=()=>{playing=false;cancelAnimationFrame(raf);t=0;last=0;playBtn.textContent='▶ Putar';draw();};
draw();
</script></body></html>
